[workspace]
resolver = "3"
members = [
    "crates/calculator-app",
    "crates/calculator-core",
    "crates/calculator-storage",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nixe-calculator"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gio = "0.22"
glib = "0.22"
gdk = { package = "gdk4", version = "0.11" }
pangocairo = "0.22"
cairo-rs = "0.22"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
async-channel = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "7cd0be5d09cd1d91510794f58bbc720605951c12" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }

[profile.release]
lto = "thin"
strip = true
